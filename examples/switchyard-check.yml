# `switchyard apply` adds this file for you. To add it by hand, copy it to
# .github/workflows/switchyard-check.yml and add a NEBIUS_API_KEY repository secret.
# It re-runs the saved tests for every call switched to Nemotron, nightly and on
# Python changes, so a call that drifts below the bar fails CI instead of failing users.
name: switchyard-check
on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths: ["**/*.py", ".switchyard/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ayushagarwalhere/switchyard@v0.2.0
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          path: "."          # folder of the app, if it isn't the repo root
