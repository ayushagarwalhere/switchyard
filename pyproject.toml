[project]
name = "switchyard"
version = "0.4.0"
description = "Migrate LLM apps to NVIDIA Nemotron on Nebius Token Factory, with per-call proof of quality."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
  "tavily-python>=0.5",
]

[project.optional-dependencies]
tracing = ["langsmith>=0.1"]
mcp = ["mcp>=1.9"]
dev = ["pytest>=8"]

[project.scripts]
switchyard = "switchyard.cli:main"

[tool.setuptools]
packages = ["switchyard"]

[tool.setuptools.package-data]
switchyard = ["web/*", "web/assets/*", "oncall_agent/*", "oncall_agent/bin/*", "oncall_agent/server/*", "oncall_agent/src/*", "oncall_agent/public/*", "oncall_agent/demo/*", "demo_apps/python/*", "demo_apps/nextjs/*", "demo_apps/nextjs/lib/*", "demo_apps/nextjs/app/api/chat/*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest_tmp"
testpaths = ["tests"]
